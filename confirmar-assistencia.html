<!doctype html>
<html lang="ca">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Confirmar assistència | E&L</title>
  <link rel="stylesheet" href="css/styles.css">
</head>


<body class="pagina-confirmacio">
  <header>
    <nav class="nav">
      <ul class="nav-links">
        <li><a href="la-nostra-historia.html">La nostra història</a></li>
        <li><a href="viatge-i-estada.html">Viatge i estada</a></li>
        <li><a href="galeria.html">Galeria</a></li>
      </ul>
      <a href="index.html" class="nav_title">
        <h3>E&L 25.09.26</h3>
      </a>
      <a class="confirmar_assistencia" href="index.html">Tornar</a>
    </nav>
  </header>

  <main class="confirmacio-main">
    <section class="confirmacio">
      <div class="confirmacio-intro">
        <h1>Confirmació d'assistència</h1>
        <p>Hi ha dies que es fan grans per les persones que els comparteixen. Ens encantarà saber si caminareu amb 
          nosaltres en aquest trosset de festa, taula i amor.</p>
      </div>

      <div class="confirmacio-layout">
        <figure class="confirmacio-foto">
          <img src="assets/banquet.jpg" alt="Eric i Laia">
        </figure>

        <!-- <form class="confirmacio-form" action="https://formsubmit.co/ericilaia.10@gmail.com" method="POST"> -->
        <form class="confirmacio-form" action="https://formsubmit.co/ericilaia.10@gmail.com" method="POST">
          <input type="hidden" name="_subject" id="subject">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="true">
          <input type="hidden" name="_next" value="https://www.ericilaia.es/gracies.html">
          <input type="text" name="_honey" style="display:none">
          <input type="hidden" name="_autoresponse" value="Confirmació rebuda 🎉">

          <div class="form-row">
            <label for="nom">Nom i cognoms</label>
            <input id="nom" name="nomicognoms" type="text" required>
          </div>

          <div class="form-row">
            <label for="email">Correu electrònic</label>
            <input id="email" name="email" type="email" required>
          </div>

          <fieldset class="form-row">
            <legend style="margin-bottom: 10px;">Podreu assistir?</legend>
            <label class="radio-option">
              <input type="radio" id="assistencia-si" name="Assistencia" value="Sí, assistirem" required>
              Sí, assistirem
            </label>
            <label class="radio-option">
              <input type="radio" id="assistencia-no" name="Assistencia" value="No podrem assistir">
              No podrem assistir
            </label>
          </fieldset>

          <div class="form-row">
            <label for="persones">Nombre de persones</label>
            <input id="persones" name="NombrePersones" type="number" min="1" max="8" value="1" required>
          </div>
          <div class="camps-assistencia">
            <!-- <div class="form-row">
              <label for="bus">Si hi hagués un bus que et portes i tornes des de Manresa, el faries servir?</label>
              <label class="radio-option">
                <input type="radio" name="Bus" value="Si" required>
                Sí
              </label>
              <label class="radio-option">
                <input type="radio" name="Bus" value="No ">
                No
              </label>
            </div> -->

            <div class="form-row">
              <label for="apat">Àpat del banquet</label>
              <select id="apat" name="ApatBanquet" required>
                <option value="">Selecciona una opció</option>
                <option value="Menu general">Menú general</option>
                <option value="Menu vegetaria">Menú vegetarià</option>
                <option value="Menu vega">Menú vegà</option>
                <option value="Menu infantil">Menú infantil</option>
                <option value="Altres necessitats">Altres necessitats</option>
              </select>
            </div>

            <div class="form-row">
              <label for="alergies">Al·lèrgies, intoleràncies i/o altres necessitats</label>
              <textarea id="alergies" name="AlergiesIntolerancies" rows="2"
                placeholder="Expliqueu-nos qualsevol detall important"></textarea>
            </div>

            <div class="form-row">
              <label for="telefonalergies">En cas de tenir al·lèrgies, intoleràncies i/o altres necessitats, deixans un teléfon de contacte</label>
              <input id="telefonalergies" name="TelefonAlergies" type="text" placeholder="Telèfon">
            </div>
               
            <div class="form-row">
              <label for="canco">Quina cançó creus que no pot faltar?</label>
              <textarea id="canco" name="Cancion" rows="1" placeholder="La teva cançó preferida"></textarea>
            </div>

          </div>
          <div id="acompanyants"></div>
          <button class="form-submit" type="submit">Enviar confirmació</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/confirmar-assistencia.js"></script>

</body>

</html>
