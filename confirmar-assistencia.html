<!doctype html>
<html lang="ca">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Confirmar assistencia | E&L</title>
  <link rel="stylesheet" href="css/styles.css">
</head>


<body class="pagina-confirmacio">
  <header>
    <nav class="nav">
      <ul class="nav-links">
        <li><a href="la-nostra-historia.html">La nostra historia</a></li>
        <li><a href="viatge-i-estada.html">Viatge i estada</a></li>
      </ul>
      <a href="index.html" class="nav_title">
        <h3>E&L 25.09.26</h3>
      </a>
      <a class="confirmar_assistencia" href="index.html">Tornar</a>
    </nav>
  </header>

  <main class="confirmacio-main">
    <section class="confirmacio">
      <div class="confirmacio-intro">
        <h1>Confirmacio d'assistencia</h1>
        <p>Hi ha dies que es fan grans per les persones que els comparteixen. Ens encantara saber si caminareu amb
          nosaltres en aquest trosset de festa, taula i amor.</p>
      </div>

      <div class="confirmacio-layout">
        <figure class="confirmacio-foto">
          <img src="assets/banquet.jpg" alt="Eric i Laia">
        </figure>

        <!-- <form class="confirmacio-form" action="https://formsubmit.co/ericilaia.10@gmail.com" method="POST"> -->
        <form class="confirmacio-form" action="https://formsubmit.co/ericilaia.10@gmail.com" method="POST">
          <input type="hidden" name="_subject" id="subject">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="true">
          <input type="hidden" name="_next" value="https://www.ericilaia.es/gracies.html">
          <input type="text" name="_honey" style="display:none">
          <input type="hidden" name="_autoresponse" value="Confirmació rebuda 🎉">

          <div class="form-row">
            <label for="nom">Nom i cognoms</label>
            <input id="nom" name="nomicognoms" type="text" required>
          </div>

          <div class="form-row">
            <label for="email">Correu electronic</label>
            <input id="email" name="email" type="email" required>
          </div>

          <fieldset class="form-row">
            <legend style="margin-bottom: 10px;">Podreu assistir?</legend>
            <label class="radio-option">
              <input type="radio" id="assistencia-si" name="Assistencia" value="Si, assistirem" required>
              Si, assistirem
            </label>
            <label class="radio-option">
              <input type="radio" id="assistencia-no" name="Assistencia" value="No podrem assistir">
              No podrem assistir
            </label>
          </fieldset>

          <div class="form-row">
            <label for="persones">Nombre de persones</label>
            <input id="persones" name="NombrePersones" type="number" min="1" max="8" value="1" required>
          </div>
          <div class="campsAssistencia">
            <div class="form-row">
              <label for="bus">Si hi hagues un bus que et portes i tornes desde Manresa, el faries servir?</label>
              <label class="radio-option">
                <input type="radio" name="Bus" value="Si" required>
                Si
              </label>
              <label class="radio-option">
                <input type="radio" name="Bus" value="No ">
                No
              </label>
            </div>

            <div class="form-row">
              <label for="apat">Apat del banquet</label>
              <select id="apat" name="ApatBanquet" required>
                <option value="">Selecciona una opcio</option>
                <option value="Menu general">Menu general</option>
                <option value="Menu vegetaria">Menu vegetaria</option>
                <option value="Menu infantil">Menu infantil</option>
                <option value="Altres necessitats">Altres necessitats</option>
              </select>
            </div>

            <div class="form-row">
              <label for="alergies">Alergies o intolerancies</label>
              <textarea id="alergies" name="AlergiesIntolerancies" rows="2"
                placeholder="Expliqueu-nos qualsevol detall important"></textarea>
            </div>

            <div class="form-row">
              <label for="canco">Cançó que no pot faltar</label>
              <textarea id="canco" name="Cancion" rows="1" placeholder="La teva cançó preferida"
                style="margin-bottom: 30px;"></textarea>
            </div>

          </div>
          <div id="acompanyants"></div>
          <button class="form-submit" type="submit">Enviar confirmacio</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const personesInput = document.getElementById("persones");
    const container = document.getElementById("acompanyants");
    const radioSi = document.getElementById("assistencia-si");
    const radioNo = document.getElementById("assistencia-no");
    const campsAssistencia = document.querySelector(".campsAssistencia");

    function crearCampos(num) {
      container.innerHTML = "";

      const noAssistiran = radioNo.checked;

      num = Math.max(1, Math.min(8, num || 1));

      for (let i = 2; i <= num; i++) {
        const div = document.createElement("div");
        div.className = "acompanyant";

        let html = `
      <hr>
      <h4>Persona ${i}</h4>

      <div class="form-row" style="margin-bottom: 20px;">
        <label>Nom i cognoms</label>
        <input type="text" name="NomiCognoms_${i}" required>
      </div>
    `;

        if (!noAssistiran) {
          html += `
        <div class="form-row" style="margin-bottom: 20px;">
          <label>Apat del banquet</label>
          <select name="ApatBanquet_${i}" required>
            <option value="">Selecciona una opcio</option>
            <option value="Menu general">Menu general</option>
            <option value="Menu vegetaria">Menu vegetaria</option>
            <option value="Menu infantil">Menu infantil</option>
            <option value="Altres necessitats">Altres necessitats</option>
          </select>
        </div>

        <div class="form-row" style="margin-bottom: 20px;"> 
          <label>Alergies o intolerancies</label>
          <textarea name="Alergies_${i}" rows="2"></textarea>
        </div>

        <div class="form-row" style="margin-bottom: 30px;">
          <label>Cançó que no pot faltar</label>
          <textarea name="Cancion_${i}" rows="1"></textarea>
        </div>
      `;
        }

        div.innerHTML = html;
        container.appendChild(div);
      }
    }

    personesInput.addEventListener("input", () => {
      let num = parseInt(personesInput.value || 1);

      if (num < 1) num = 1;
      if (num > 8) num = 8;

      crearCampos(num);
    });

    document.querySelector("form").addEventListener("submit", function () {
      const name = document.getElementById("nom").value;
      document.getElementById("subject").value = "Nova confirmacio d'assistencia E&L - " + name;
    });

    function toggleAssistencia() {
      if (radioNo.checked) {
        campsAssistencia.style.display = "none";
      } else {
        campsAssistencia.style.display = "block";
      }

      crearCampos(parseInt(personesInput.value || 1));
    }

    radioSi.addEventListener("change", toggleAssistencia);
    radioNo.addEventListener("change", toggleAssistencia);
  </script>
</body>

</html>
